name: Test mocha-json reporter with step-summary output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture to workspace
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/mocha-passing.json" "$GITHUB_WORKSPACE/mocha-results.json"

      - id: action
        uses: .
        with:
          name: "Mocha Tests"
          path: "mocha-results.json"
          reporter: mocha-json
          list-suites: all
          list-tests: all
          max-annotations: '10'
          fail-on-error: 'true'
          output-to: step-summary

      - name: Assert conclusion is success
        env:
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "conclusion: $CONCLUSION"
          if [ "$CONCLUSION" != "success" ]; then
            echo "FAIL: expected conclusion 'success', got '$CONCLUSION'"
            exit 1
          fi
          echo "PASS: conclusion is success"

      - name: Assert passed count
        env:
          PASSED: ${{ steps.action.outputs.passed }}
        run: |
          echo "passed: $PASSED"
          if [ "$PASSED" != "2" ]; then
            echo "FAIL: expected 2 passed tests, got '$PASSED'"
            exit 1
          fi
          echo "PASS: passed count is 2"

      - name: Assert failed count is zero
        env:
          FAILED: ${{ steps.action.outputs.failed }}
        run: |
          echo "failed: $FAILED"
          if [ "$FAILED" != "0" ]; then
            echo "FAIL: expected 0 failed tests, got '$FAILED'"
            exit 1
          fi
          echo "PASS: failed count is 0"

      - name: Assert time output is set
        env:
          TIME: ${{ steps.action.outputs.time }}
        run: |
          echo "time: $TIME"
          if [ -z "$TIME" ]; then
            echo "FAIL: expected time output to be set"
            exit 1
          fi
          echo "PASS: time output is set"
