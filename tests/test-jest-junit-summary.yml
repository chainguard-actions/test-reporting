name: Test Jest JUnit reporting with only-summary
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          name: "Jest Test Results Summary"
          path: "tests/fixtures/jest-junit-results.xml"
          reporter: jest-junit
          list-suites: all
          list-tests: none
          max-annotations: 10
          fail-on-error: "false"
          only-summary: "true"
          output-to: step-summary

      - name: Assert action ran with jest-junit reporter
        env:
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
          PASSED: ${{ steps.action.outputs.passed }}
          FAILED: ${{ steps.action.outputs.failed }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          echo "passed: $PASSED"
          echo "failed: $FAILED"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CONCLUSION" ]; then
              echo "FAIL: action succeeded but conclusion output is empty"
              exit 1
            fi
            if [ "$CONCLUSION" != "success" ]; then
              echo "FAIL: expected conclusion 'success' but got '$CONCLUSION'"
              exit 1
            fi
            if [ "$PASSED" != "2" ]; then
              echo "FAIL: expected 2 passed tests but got '$PASSED'"
              exit 1
            fi
            echo "PASS: action succeeded with jest-junit reporter"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo / checks API not available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
