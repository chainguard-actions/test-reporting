name: Test only-summary mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture to workspace
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/jest-junit-passing.xml" "$GITHUB_WORKSPACE/test-results-summary.xml"

      - id: action
        uses: .
        with:
          name: "Jest Tests Summary Only"
          path: "test-results-summary.xml"
          reporter: jest-junit
          list-suites: all
          list-tests: all
          max-annotations: '10'
          fail-on-error: 'true'
          only-summary: 'true'
          output-to: step-summary

      - name: Assert conclusion is success
        env:
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "conclusion: $CONCLUSION"
          if [ "$CONCLUSION" != "success" ]; then
            echo "FAIL: expected conclusion 'success', got '$CONCLUSION'"
            exit 1
          fi
          echo "PASS: conclusion is success"

      - name: Assert passed count
        env:
          PASSED: ${{ steps.action.outputs.passed }}
        run: |
          echo "passed: $PASSED"
          if [ "$PASSED" != "3" ]; then
            echo "FAIL: expected 3 passed tests, got '$PASSED'"
            exit 1
          fi
          echo "PASS: passed count is 3"
