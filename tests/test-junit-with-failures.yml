name: Test JUnit reporting with test failures
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          name: "JUnit Failing Test Results"
          path: "tests/fixtures/junit-results-with-failures.xml"
          reporter: java-junit
          list-suites: all
          list-tests: failed
          max-annotations: 10
          fail-on-error: "true"
          output-to: step-summary

      - name: Assert action ran and detected failures
        env:
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
          PASSED: ${{ steps.action.outputs.passed }}
          FAILED: ${{ steps.action.outputs.failed }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          echo "passed: $PASSED"
          echo "failed: $FAILED"
          if [ "$OUTCOME" = "failure" ]; then
            # Could be failing because of sentinel repo (checks API) OR because fail-on-error=true
            # Both are acceptable outcomes
            echo "PASS: action failed as expected (either test failures detected or sentinel repo)"
          elif [ "$OUTCOME" = "success" ]; then
            # If it somehow succeeded (e.g. step-summary path), check outputs
            if [ "$CONCLUSION" != "failure" ]; then
              echo "FAIL: expected conclusion 'failure' due to test failures but got '$CONCLUSION'"
              exit 1
            fi
            if [ "$FAILED" != "1" ]; then
              echo "FAIL: expected 1 failed test but got '$FAILED'"
              exit 1
            fi
            echo "PASS: action correctly identified test failures"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
