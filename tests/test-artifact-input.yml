name: Test artifact input with jest-junit reporter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          name: "Jest Test Results"
          path: "actions/hardened/phoenix-actions--test-reporting/v15/tests/fixtures/jest-results.xml"
          artifact: "test-results-artifact"
          reporter: jest-junit
          list-suites: failed
          list-tests: failed
          max-annotations: 5
          fail-on-error: 'false'
          output-to: step-summary
          token: ${{ github.token }}
      - name: Assert conclusion output
        env:
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "conclusion: $CONCLUSION"
          if [ "$CONCLUSION" != "success" ]; then
            echo "FAIL: expected conclusion to be 'success', got '$CONCLUSION'"
            exit 1
          fi
          echo "PASS"
      - name: Assert passed count
        env:
          PASSED: ${{ steps.action.outputs.passed }}
        run: |
          echo "passed: $PASSED"
          if [ "$PASSED" != "2" ]; then
            echo "FAIL: expected passed=2, got '$PASSED'"
            exit 1
          fi
          echo "PASS"
