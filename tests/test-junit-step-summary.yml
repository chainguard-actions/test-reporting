name: Test JUnit reporting with step-summary
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create JUnit test results
        run: |
          mkdir -p /tmp/test-results
          cat > /tmp/test-results/results.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuites name="Test Suite" tests="3" failures="0" errors="0" time="1.234">
            <testsuite name="ExampleSuite" tests="3" failures="0" errors="0" time="1.234">
              <testcase name="test_one" classname="ExampleSuite" time="0.5"/>
              <testcase name="test_two" classname="ExampleSuite" time="0.4"/>
              <testcase name="test_three" classname="ExampleSuite" time="0.334"/>
            </testsuite>
          </testsuites>
          EOF

      - id: action
        uses: .
        with:
          name: JUnit Test Report
          path: /tmp/test-results/results.xml
          reporter: java-junit
          list-suites: all
          list-tests: all
          max-annotations: 10
          fail-on-error: 'false'
          output-to: step-summary
        continue-on-error: true

      - name: Assert action ran and produced outputs
        env:
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
          PASSED: ${{ steps.action.outputs.passed }}
          FAILED: ${{ steps.action.outputs.failed }}
          SKIPPED: ${{ steps.action.outputs.skipped }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          echo "passed: $PASSED"
          echo "failed: $FAILED"
          echo "skipped: $SKIPPED"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$PASSED" ]; then
              echo "FAIL: action succeeded but passed count is empty"
              exit 1
            fi
            if [ "$CONCLUSION" != "success" ]; then
              echo "FAIL: expected conclusion 'success' but got '$CONCLUSION'"
              exit 1
            fi
            if [ "$PASSED" != "3" ]; then
              echo "FAIL: expected 3 passed tests but got '$PASSED'"
              exit 1
            fi
            if [ "$FAILED" != "0" ]; then
              echo "FAIL: expected 0 failed tests but got '$FAILED'"
              exit 1
            fi
            echo "PASS: all assertions passed"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or API issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
