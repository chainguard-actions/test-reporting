name: Test with failing test results
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          name: "Failing JUnit Test Results"
          path: "actions/hardened/phoenix-actions--test-reporting/v16/tests/fixtures/junit-failing/results.xml"
          reporter: java-junit
          list-suites: failed
          list-tests: failed
          max-annotations: '10'
          fail-on-error: 'false'
          output-to: step-summary
          artifact: ""
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Assert conclusion is failure
        env:
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "conclusion: $CONCLUSION"
          if [ "$CONCLUSION" != "failure" ]; then
            echo "FAIL: expected conclusion to be 'failure', got '$CONCLUSION'"
            exit 1
          fi
          echo "PASS"
      - name: Assert failed count
        env:
          FAILED: ${{ steps.action.outputs.failed }}
        run: |
          echo "failed: $FAILED"
          if [ "$FAILED" != "1" ]; then
            echo "FAIL: expected failed=1, got '$FAILED'"
            exit 1
          fi
          echo "PASS"
      - name: Assert passed count
        env:
          PASSED: ${{ steps.action.outputs.passed }}
        run: |
          echo "passed: $PASSED"
          if [ "$PASSED" != "1" ]; then
            echo "FAIL: expected passed=1, got '$PASSED'"
            exit 1
          fi
          echo "PASS"
