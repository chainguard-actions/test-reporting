name: Test working-directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up test results in a subdirectory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/subdir/test-results"
          cp "$GITHUB_WORKSPACE/tests/fixtures/junit-results.xml" \
             "$GITHUB_WORKSPACE/subdir/test-results/junit-results.xml"

      - id: action
        uses: .
        continue-on-error: true
        with:
          name: "JUnit Test Results (working-directory)"
          path: "test-results/junit-results.xml"
          reporter: java-junit
          list-suites: all
          list-tests: all
          max-annotations: 10
          fail-on-error: "false"
          output-to: step-summary
          working-directory: subdir

      - name: Assert action ran with working-directory input
        env:
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
          PASSED: ${{ steps.action.outputs.passed }}
          FAILED: ${{ steps.action.outputs.failed }}
          SKIPPED: ${{ steps.action.outputs.skipped }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          echo "passed: $PASSED"
          echo "failed: $FAILED"
          echo "skipped: $SKIPPED"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CONCLUSION" ]; then
              echo "FAIL: action succeeded but conclusion output is empty"
              exit 1
            fi
            if [ "$CONCLUSION" != "success" ]; then
              echo "FAIL: expected conclusion 'success' but got '$CONCLUSION'"
              exit 1
            fi
            if [ "$PASSED" != "3" ]; then
              echo "FAIL: expected 3 passed tests but got '$PASSED'"
              exit 1
            fi
            echo "PASS: action succeeded with working-directory input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo / checks API not available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
