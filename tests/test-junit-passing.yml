name: Test JUnit passing results
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create JUnit test results file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-results"
          cat > "$GITHUB_WORKSPACE/test-results/results.xml" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuites name="Test Suite" tests="3" failures="0" errors="0" time="1.234">
            <testsuite name="com.example.MyTest" tests="3" failures="0" errors="0" time="1.234">
              <testcase name="testOne" classname="com.example.MyTest" time="0.100"/>
              <testcase name="testTwo" classname="com.example.MyTest" time="0.200"/>
              <testcase name="testThree" classname="com.example.MyTest" time="0.934"/>
            </testsuite>
          </testsuites>
          EOF

      - id: action
        uses: .
        with:
          name: JUnit Test Results
          path: test-results/results.xml
          reporter: java-junit
          list-suites: all
          list-tests: all
          max-annotations: 10
          fail-on-error: 'true'
          output-to: step-summary

      - name: Assert conclusion is success
        env:
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "conclusion: $CONCLUSION"
          if [ "$CONCLUSION" != "success" ]; then
            echo "FAIL: expected conclusion 'success', got '$CONCLUSION'"
            exit 1
          fi
          echo "PASS: conclusion is success"

      - name: Assert passed count
        env:
          PASSED: ${{ steps.action.outputs.passed }}
        run: |
          echo "passed: $PASSED"
          if [ "$PASSED" != "3" ]; then
            echo "FAIL: expected 3 passed tests, got '$PASSED'"
            exit 1
          fi
          echo "PASS: passed count is 3"

      - name: Assert failed count is zero
        env:
          FAILED: ${{ steps.action.outputs.failed }}
        run: |
          echo "failed: $FAILED"
          if [ "$FAILED" != "0" ]; then
            echo "FAIL: expected 0 failed tests, got '$FAILED'"
            exit 1
          fi
          echo "PASS: failed count is 0"
