name: Test basic JUnit reporting
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          name: "JUnit Test Results"
          path: "actions/hardened/phoenix-actions--test-reporting/v14/tests/fixtures/junit-results/results.xml"
          reporter: java-junit
          list-suites: all
          list-tests: all
          max-annotations: 10
          fail-on-error: "false"
          output-to: step-summary
      - name: Assert conclusion output
        env:
          ACTUAL: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "conclusion: $ACTUAL"
          if [ "$ACTUAL" != "success" ]; then
            echo "FAIL: expected conclusion 'success', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert passed count
        env:
          ACTUAL: ${{ steps.action.outputs.passed }}
        run: |
          echo "passed: $ACTUAL"
          if [ "$ACTUAL" != "3" ]; then
            echo "FAIL: expected passed '3', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert failed count
        env:
          ACTUAL: ${{ steps.action.outputs.failed }}
        run: |
          echo "failed: $ACTUAL"
          if [ "$ACTUAL" != "0" ]; then
            echo "FAIL: expected failed '0', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
