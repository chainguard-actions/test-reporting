name: Test checks output mode (GitHub API)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture to workspace
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/jest-junit-passing.xml" "$GITHUB_WORKSPACE/test-results-checks.xml"

      - id: action
        uses: .
        with:
          name: "Jest Tests via Checks API"
          path: "test-results-checks.xml"
          reporter: jest-junit
          list-suites: all
          list-tests: all
          max-annotations: '10'
          fail-on-error: 'false'
          output-to: checks
        continue-on-error: true

      - name: Assert action ran (success or graceful failure on sentinel repo)
        env:
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CONCLUSION" ]; then
              echo "FAIL: action succeeded but conclusion output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with conclusion '$CONCLUSION'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via GitHub API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
