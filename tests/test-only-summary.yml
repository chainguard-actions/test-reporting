name: Test only-summary mode with wildcard path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          name: "Summary Only JUnit Results"
          path: "actions/hardened/phoenix-actions--test-reporting/v16/tests/fixtures/junit-results/*.xml"
          reporter: java-junit
          list-suites: all
          list-tests: none
          max-annotations: '10'
          fail-on-error: 'false'
          output-to: step-summary
          only-summary: 'true'
          path-replace-backslashes: 'false'
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Assert conclusion is success
        env:
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "conclusion: $CONCLUSION"
          if [ "$CONCLUSION" != "success" ]; then
            echo "FAIL: expected conclusion to be 'success', got '$CONCLUSION'"
            exit 1
          fi
          echo "PASS"
      - name: Assert passed count
        env:
          PASSED: ${{ steps.action.outputs.passed }}
        run: |
          echo "passed: $PASSED"
          if [ "$PASSED" != "3" ]; then
            echo "FAIL: expected passed=3, got '$PASSED'"
            exit 1
          fi
          echo "PASS"
