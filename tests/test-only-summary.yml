name: Test only-summary option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create JUnit test results for summary test
        run: |
          mkdir -p /tmp/summary-results
          cat > /tmp/summary-results/results.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuites name="Summary Suite" tests="5" failures="1" errors="0" time="3.0">
            <testsuite name="SummarySuite" tests="5" failures="1" errors="0" time="3.0">
              <testcase name="test_a" classname="SummarySuite" time="0.5"/>
              <testcase name="test_b" classname="SummarySuite" time="0.5"/>
              <testcase name="test_c" classname="SummarySuite" time="0.5"/>
              <testcase name="test_d" classname="SummarySuite" time="0.5"/>
              <testcase name="test_e" classname="SummarySuite" time="0.5">
                <failure message="Expected value to be true">Expected value to be true</failure>
              </testcase>
            </testsuite>
          </testsuites>
          EOF

      - id: action
        uses: .
        with:
          name: Summary Only Report
          path: /tmp/summary-results/results.xml
          reporter: java-junit
          list-suites: all
          list-tests: all
          max-annotations: 10
          fail-on-error: 'false'
          only-summary: 'true'
          output-to: step-summary
        continue-on-error: true

      - name: Assert action ran with only-summary enabled
        env:
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
          PASSED: ${{ steps.action.outputs.passed }}
          FAILED: ${{ steps.action.outputs.failed }}
          SKIPPED: ${{ steps.action.outputs.skipped }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          echo "passed: $PASSED"
          echo "failed: $FAILED"
          echo "skipped: $SKIPPED"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$PASSED" ]; then
              echo "FAIL: action succeeded but passed count is empty"
              exit 1
            fi
            if [ "$CONCLUSION" != "failure" ]; then
              echo "FAIL: expected conclusion 'failure' (1 failed test) but got '$CONCLUSION'"
              exit 1
            fi
            if [ "$PASSED" != "4" ]; then
              echo "FAIL: expected 4 passed tests but got '$PASSED'"
              exit 1
            fi
            if [ "$FAILED" != "1" ]; then
              echo "FAIL: expected 1 failed test but got '$FAILED'"
              exit 1
            fi
            echo "PASS: only-summary mode worked correctly"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or API issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
