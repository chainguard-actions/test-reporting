name: 'Dirty Laundry Test'
on:
  pull_request:
    paths-ignore: ['**.md']
  push:
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  actions: read

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: npm ci
      - run: npm run build
      - run: npm run format-check
      - run: npm run lint
